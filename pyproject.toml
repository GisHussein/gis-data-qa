[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-data-qa"
version = "0.1.0"
description = "Validate a spatial layer against a written rule file, and fail the build when it does not hold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hussein Fanjry" }]
keywords = ["gis", "geospatial", "data-quality", "geopandas", "validation", "postgis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gisqa = "gisqa.cli:main"

[project.urls]
Repository = "https://github.com/GisHussein/gis-data-qa"

[tool.setuptools.packages.find]
include = ["gisqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
